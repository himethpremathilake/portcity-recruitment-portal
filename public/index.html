// ===== FIRESTORE HELPERS =====
async function loadSettings() {
  const doc = await db.collection('settings').doc('config').get();
  if (doc.exists) {
    const data = doc.data();
    DB.divisions = data.divisions || [];
    DB.departments = data.departments || {};
    DB.nextId = data.nextId || 7;
  } else {
    await saveSettingsData(DEFAULT_SETTINGS);
  }
}

async function saveSettingsData(cfg) {
  DB.divisions = cfg.divisions;
  DB.departments = cfg.departments;
  DB.nextId = cfg.nextId;
  await db.collection('settings').doc('config').set(cfg);
}

async function saveSettingsCurrent() {
  await db.collection('settings').doc('config').set({
    divisions: DB.divisions,
    departments: DB.departments,
    nextId: DB.nextId
  });
}

async function saveReq(r) {
  const clean = JSON.parse(JSON.stringify(r));
  await db.collection('requisitions').doc(String(r.id)).set(clean);
}

async function updateReq(id, updates) {
  const clean = JSON.parse(JSON.stringify(updates));
  await db.collection('requisitions').doc(String(id)).update(clean);
}

// ===== REAL-TIME LISTENERS =====
function startListeners() {
  unsubscribers.forEach(u => u());
  unsubscribers = [];

  unsubscribers.push(
    db.collection('requisitions').onSnapshot(snap => {
      DB.reqs = snap.docs.map(d => {
        const data = d.data();
        return { ...data, id: isNaN(+d.id) ? data.id : +d.id };
      });
      if (me) render();
    })
  );

  unsubscribers.push(
    db.collection('notifications').onSnapshot(snap => {
      DB.notifs = snap.docs.map(d => d.data());
      const mine = DB.notifs.filter(n => n.to === me?.email && !n.read).length;
      const el = $('#nCount');
      if (el) el.textContent = mine || '';
    })
  );
}

// ===== AUTH =====
document.getElementById('signInBtn').onclick = async () => {
  const btn = document.getElementById('signInBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg> Sign in with Google`;
    const err = $('#loginError');
    err.style.display = 'block';
    err.textContent = e.message;
  }
};

function signOut() {
  unsubscribers.forEach(u => u());
  unsubscribers = [];
  auth.signOut();
}

auth.onAuthStateChanged(async user => {
  if (!user) {
    $('#loginScreen').style.display = 'flex';
    $('#appShell').style.display = 'none';
    const btn = document.getElementById('signInBtn');
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg> Sign in with Google`;
    me = null;
    return;
  }

  const userDoc = await db.collection('users').doc(user.email).get();

  if (!userDoc.exists && !isSuperAdmin(user.email)) {
    const err = $('#loginError');
    err.style.display = 'block';
    err.textContent = `Access denied. ${user.email} is not authorized. Contact your HR administrator.`;
    await auth.signOut();
    return;
  }

  let userData;
  if (userDoc.exists) {
    userData = userDoc.data();
  } else {
    userData = { name: user.displayName || user.email, role: 'HR / Recruiter', div: 'All', email: user.email };
    await db.collection('users').doc(user.email).set(userData);
  }

  me = { email: user.email, name: userData.name || user.displayName || user.email, role: userData.role, div: userData.div };

  $('#loginScreen').style.display = 'none';
  $('#appShell').style.display = 'flex';

  if (user.photoURL) {

    av.src = user.photoURL;
    av.classList.remove('hidden');
    $('#userInitial').style.display = 'none';
  } else {
    $('#userInitial').textContent = me.name.charAt(0).toUpperCase();
  }
  $('#userName').textContent = me.name;
  $('#userRoleLabel').textContent = me.role + (me.div !== 'All' ? ` · ${me.div}` : '');
  if (isSuperAdmin(me.email)) $('#resetBtn').style.display = 'block';

  await loadSettings();
  page = NAV[me.role][0][0];
  startListeners();
  render();
});

// ===== RESET DEMO DATA =====
async function resetData() {
  if (!confirm('Replace all data with demo data?')) return;
  toast('Resetting…');
  try {
    const [reqsSnap, notifsSnap] = await Promise.all([
      db.collection('requisitions').get(),
      db.collection('notifications').get()
    ]);
    const b1 = db.batch();
    reqsSnap.docs.forEach(d => b1.delete(d.ref));
    notifsSnap.docs.forEach(d => b1.delete(d.ref));
    await b1.commit();

    const b2 = db.batch();
    DEFAULT_REQS.forEach(r => b2.set(db.collection('requisitions').doc(String(r.id)), r));
    await b2.commit();

    await saveSettingsData(DEFAULT_SETTINGS);
    toast('Demo data reset');
  } catch(e) {
    toast('Error: ' + e.message);
  }
}

function toggleNotif() {
  const b = $('#notifBox');
  const list = DB.notifs.filter(n => n.to === me.email);
  b.innerHTML = `<div class="p-3 border-b flex justify-between text-sm font-semibold">Notifications<button class="text-blue-700 text-xs" onclick="markAllRead()">Mark all read</button></div>` +
    (list.map(n => `<div class="p-3 border-b text-sm ${n.read?'opacity-60':'font-medium'}"><div>${esc(n.title)}</div><div class="text-gray-600 font-normal">${esc(n.msg)}</div><div class="text-xs text-gray-400">${n.at}</div></div>`).join('') || '<div class="p-4 text-sm text-gray-500">No notifications</div>');
  b.classList.toggle('hidden');
}

async function markAllRead() {
  const toUpdate = DB.notifs.filter(n => n.to === me.email && !n.read);
  if (!toUpdate.length) return;
  const batch = db.batch();
  toUpdate.forEach(n => {
    batch.update(db.collection('notifications').doc(String(n.id)), { read: true });
    n.read = true;
  });
  await batch.commit();
  toggleNotif();
  $('#nCount').textContent = '';
}

// ===== NOTIFICATIONS =====
async function notify(role, div, title, msg) {
  const snap = await db.collection('users').get();
  const targets = snap.docs
    .map(d => ({ email: d.id, ...d.data() }))
    .filter(u => u.role === role && (div == null || u.div === div || u.div === 'All'));
  if (!targets.length) return;
  const batch = db.batch();
  targets.forEach(u => {
    const id = Date.now() + Math.random();
    const n = { id, to: u.email, title, msg, read: false, at: new Date().toISOString().slice(0, 10) };
    batch.set(db.collection('notifications').doc(String(id)), n);
  });
  await batch.commit();
}

function initForm() {
  const f = $('#reqForm');
  f.dept.onchange = () => { f.title.innerHTML = (DB.departments[f.dept.value]||[]).map(d=>`<option>${esc(d)}</option>`).join('') || '<option value="">—</option>'; };
  f.querySelectorAll('[name=reason]').forEach(r => r.onchange = () => $('#replBox').classList.toggle('hidden', f.reason.value !== 'Replacement'));
  f.querySelectorAll('button[data-s]').forEach(b => b.onclick = async e => {
    e.preventDefault();
    const st = b.dataset.s;
    if (st !== 'Draft' && !f.reportValidity()) return;
    b.disabled = true; b.textContent = 'Saving…';
    try {
      const fd = Object.fromEntries(new FormData(f));
      const id = DB.nextId++;
      const r = {
        id, title: fd.title||'Untitled', dept: fd.dept, div: fd.div, hc: +fd.hc||1,
        type: fd.type, head: fd.head, target: fd.target, resp: fd.resp, salary: fd.salary,
        shifts: fd.shifts, reason: fd.reason, budget: fd.budget, resName: fd.resName,
        lwd: fd.lwd, equip: fd.equip, jd: !!fd.jd, status: st, by: me.email,
        created: new Date().toISOString().slice(0,10),
        log: [{a: st, by: me.name, at: new Date().toLocaleString()}]
      };
      if (me.role === 'Division Head' && st !== 'Draft') {
        r.status = 'With Recruitment';
        r.signature = 'typed:' + me.name;
        await notify('HR / Recruiter', null, 'New approved requisition', `${r.title} (${r.div}) ready for recruitment`);
      } else if (st !== 'Draft') {
        await notify('Division Head', r.div, 'Approval needed', `${r.title} submitted by ${me.name}`);
        await notify('HR / Recruiter', null, 'New requisition', `${r.title} submitted by ${me.name}`);
      }
      await saveReq(r);
      await saveSettingsCurrent();
      toast('Request saved');
      go(isHR() ? 'vault' : 'mine');
    } catch(err) {
      toast('Error: ' + err.message);
      b.disabled = false; b.textContent = st === 'Draft' ? 'Save Draft' : 'Submit for Sign-Off';
    }
  });
}

/* ---------- Actions ---------- */
function act(id, action) {
  const r = DB.reqs.find(x => x.id === id);
  const extra = {
    approve: '<label class="text-sm font-medium">Type your full name to sign *</label><input id="mSig" class="inp mb-3">',
    fill: '<label class="text-sm">Candidate name *</label><input id="mCand" class="inp mb-2"><label class="text-sm">Fill date</label><input id="mDate" type="date" class="inp mb-3">',
    suggest3p: '<label class="text-sm">Agency name *</label><input id="mAg" class="inp mb-2"><label class="text-sm">Package / Fee *</label><input id="mFee" class="inp mb-2"><label class="text-sm">Other relevant details</label><textarea id="mDet" class="inp mb-3"></textarea>',
    approve3p: '<label class="text-sm font-medium">Type your full name to sign *</label><input id="mSig" class="inp mb-3">',
    manatal: `<label class="text-sm">Manatal link</label><input id="mLink" class="inp mb-3" value="${esc(r.manatal||'')}">`
  }[action] || '';
  const label = {hold:'Put on Hold',withdraw:'Withdraw Request',reject:'Reject Request',sendback:'Send Back for Clarification',resume:'Resume Request',approve:'Approve & Sign',fill:'Mark as Filled',suggest3p:'Suggest 3rd-Party Headhunter',approve3p:'Approve 3rd-Party Headhunter',manatal:'Manatal Link'}[action];
  const commentReq = ['hold','reject','sendback','withdraw'].includes(action);
  modal(`<h3 class="text-lg font-bold mb-1">${label}</h3><p class="text-sm text-gray-500 mb-4">${esc(r.title)} · ${r.div}</p>${extra}${action==='manatal'?'':`<label class="text-sm">Comment ${commentReq?'*':'(optional)'}</label><textarea id="mCom" class="inp mb-4"></textarea>`}<div class="flex justify-end gap-2"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn ${['withdraw','reject'].includes(action)?'btn-d':'btn-p'}" onclick="doAct(${id},'${action}',${commentReq})">Confirm</button></div>`);
}

async function doAct(id, action, commentReq) {
  const r = DB.reqs.find(x => x.id === id);
  const v = s => ($(s)?.value||'').trim();
  const c = v('#mCom');
  if (commentReq && !c) return toast('Comment is required');
  const T = {hold:'On Hold',withdraw:'Withdrawn',reject:'Rejected',sendback:'More Info Requested',resume:'Pending Sign-Off',approve:'With Recruitment',fill:'Filled',post:'Posted',shortlist:'Shortlisting'};
  const updates = {};
  if (action === 'approve' || action === 'approve3p') {
    if (!v('#mSig')) return toast('Signature required');
    updates.signature = 'typed:' + v('#mSig'); r.signature = updates.signature;
  }
  if (action === 'fill') {
    if (!v('#mCand')) return toast('Candidate name required');
    updates.candidate = v('#mCand'); updates.filledDate = v('#mDate') || new Date().toISOString().slice(0,10);
    r.candidate = updates.candidate; r.filledDate = updates.filledDate;
  }
  if (action === 'suggest3p') {
    if (!v('#mAg')||!v('#mFee')) return toast('Agency and fee required');
    Object.assign(updates, {tp:true, tpAgency:v('#mAg'), tpFee:v('#mFee'), tpTerms:v('#mDet'), tpStatus:'Pending DH Approval'});
    Object.assign(r, updates);
    await notify('Division Head', r.div, '3P approval needed', `HR suggests ${r.tpAgency} for ${r.title}`);
  }
  if (action === 'approve3p') {
    updates.tpStatus = 'DH Approved'; r.tpStatus = 'DH Approved';
    await notify('HR / Recruiter', null, '3P approved', `${r.title}: headhunter approved by ${me.name}`);
  }
  if (action === 'manatal') { updates.manatal = v('#mLink'); r.manatal = updates.manatal; }
  if (action === 'hold') { updates.hold = c; r.hold = c; }
  if (action === 'post') { updates.posted = true; r.posted = true; }
  if (T[action]) {
    updates.status = T[action]; r.status = T[action];
    await notify('HR / Recruiter', null, `Requisition ${T[action]}`, `${r.title} (${r.div}) → ${T[action]} by ${me.name}`);
    if (action === 'resume' || action === 'sendback') await notify('Division Head', r.div, 'Requisition update', `${r.title} → ${T[action]}`);
  }
  const newLog = [...(r.log||[]), {a:label2(action), by:me.name, at:new Date().toLocaleString(), c}];
  updates.log = newLog; r.log = newLog;
  await updateReq(id, updates);
  closeModal(); render(); toast('Done');
}

const label2 = a => ({suggest3p:'3P Suggested', approve3p:'3P Approved'}[a] || a);
async function quick(id, a) { await doAct(id, a, false); }

/* ---------- My Requests ---------- */
const STEPS = ['Submitted','Signed Off','With Recruitment','Shortlisting','Filled'];
const stepIdx = s => ({'Pending Sign-Off':0,'More Info Requested':0,'Approved':1,'With Recruitment':2,'Posted':2,'Shortlisting':3,'Filled':4}[s] ?? -1);

function viewMine() {
  const FS = {All:()=>true, Pending:r=>['Pending Sign-Off','More Info Requested','Draft'].includes(r.status), Approved:r=>['With Recruitment','Posted','Shortlisting','Filled','Approved'].includes(r.status), 'On Hold':r=>r.status==='On Hold', Withdrawn:r=>r.status==='Withdrawn'};
  const all = visible().filter(r => r.by === me.email || me.role === 'Division Head');
  const list = all.filter(FS[filter]);
  const k = (n,l) => `<div class="bg-white border rounded-xl p-4"><p class="text-2xl font-bold">${n}</p><p class="text-xs text-gray-500">${l}</p></div>`;
  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">${k(all.length,'Total Submitted')}${k(all.filter(FS.Pending).length,'Awaiting Action')}${k(all.filter(r=>['With Recruitment','Posted','Shortlisting'].includes(r.status)).length,'In Recruitment')}${k(all.filter(r=>r.status==='Filled').length,'Filled')}</div>
  <div class="flex gap-2 mb-4 flex-wrap">${Object.keys(FS).map(f=>`<button class="badge text-sm px-3 py-1 ${f===filter?'bg-blue-700 text-white':'bg-white border'}" onclick="filter='${f}';render()">${f}</button>`).join('')}<button class="btn btn-o ml-auto" onclick="exportCSV(${JSON.stringify(list.map(r=>r.id))})">⬇ Export CSV</button></div>
  <div class="space-y-3">${list.map(r => {
    const i = stepIdx(r.status);
    return `<div class="bg-white border rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 ${r.status==='On Hold'?'bg-orange-50':''}">
    <div><div class="flex gap-2 items-center"><a class="font-semibold cursor-pointer hover:underline" onclick="detail(${r.id})">${esc(r.title)}</a>${badge(r.status)}</div>
    <p class="text-xs text-gray-500">${r.hc} position(s) · ${r.type} · Submitted ${r.created}</p>
    ${r.status==='On Hold'?`<p class="text-xs italic text-orange-700 mt-1">Held — "${esc(r.hold)}"</p>`:''}
    <div class="flex flex-wrap gap-1 mt-2 text-[11px]">${STEPS.map((s,j)=>`<span class="px-2 py-0.5 rounded ${j<=i?'bg-blue-700 text-white':'bg-gray-100 text-gray-500'}">${s}</span>`).join('<span class="text-gray-400">→</span>')}</div></div>
    <div class="flex gap-2">${actionsFor(r)}</div></div>`;
  }).join('')||'<p class="text-gray-500 text-sm">No requests.</p>'}</div>`;
}

function actionsFor(r) {
  const b = (a,l,c='btn-o') => `<button class="btn ${c}" onclick="act(${r.id},'${a}')">${l}</button>`;
  if (r.status === 'On Hold') return b('resume','Resume');
  if (['Filled','Withdrawn','Rejected'].includes(r.status)) return '';
  return b('hold','Hold') + b('withdraw','Withdraw');
}

/* ---------- Charts (SVG) ---------- */
function bars(data) {
  const max = Math.max(1, ...data.flatMap(d=>[d.a,d.b]));
  return `<svg viewBox="0 0 ${data.length*70+20} 170" class="w-full h-44">${data.map((d,i)=>{const x=20+i*70,h1=d.a/max*130,h2=d.b/max*130;return `<rect x="${x}" y="${140-h1}" width="22" height="${h1}" fill="#1d4ed8" rx="3"/><rect x="${x+25}" y="${140-h2}" width="22" height="${h2}" fill="#10b981" rx="3"/><text x="${x+24}" y="158" font-size="10" text-anchor="middle" fill="#555">${esc(d.l)}</text>`}).join('')}</svg><div class="flex gap-4 text-xs"><span>🟦 Open</span><span>🟩 Filled</span></div>`;
}
function donut(counts) {
  const tot = Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const pal = ['#1d4ed8','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#64748b','#ec4899'];
  let off=0,i=0;
  const segs = Object.entries(counts).map(([k,v])=>{const p=v/tot*100;const s=`<circle r="15.9" cx="20" cy="20" fill="none" stroke="${pal[i%8]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}"/>`;off+=p;i++;return s}).join('');
  i=0;
  return `<div class="flex items-center gap-6"><svg viewBox="0 0 40 40" class="w-40 h-40 -rotate-90">${segs}</svg><div class="text-xs space-y-1">${Object.entries(counts).map(([k,v])=>`<div><span style="background:${pal[(i++)%8]}" class="inline-block w-3 h-3 rounded-sm mr-1"></span>${esc(k)}: ${v}</div>`).join('')}</div></div>`;
}
function agingTable(list, showDiv, withActions) {
  list = [...list].sort((a,b) => days(b)-days(a));
  return `<div class="bg-white border rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">Position</th>${showDiv?'<th class="p-3 text-left">Division</th>':''}<th class="p-3 text-left">HC</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Days Open</th><th class="p-3 text-left">Flag</th>${withActions?'<th class="p-3 text-left">Actions</th>':''}</tr></thead><tbody>${list.map(r=>`<tr class="border-t"><td class="p-3"><a class="cursor-pointer hover:underline" onclick="detail(${r.id})">${esc(r.title)}</a></td>${showDiv?`<td class="p-3">${r.div}</td>`:''}<td class="p-3">${r.hc}</td><td class="p-3">${badge(r.status)}</td><td class="p-3">${days(r)}d</td><td class="p-3">${flag(days(r))}</td>${withActions?`<td class="p-3 flex gap-1">${actionsFor(r)}</td>`:''}</tr>`).join('')||'<tr><td class="p-4 text-gray-500" colspan="7">No open requisitions</td></tr>'}</tbody></table></div>`;
}
const kpi = (n,l) => `<div class="bg-white border rounded-xl p-4 text-center"><p class="text-2xl font-bold text-blue-800">${n}</p><p class="text-xs text-gray-500">${l}</p></div>`;
function statusCounts(list) { const c={}; list.forEach(r=>c[r.status]=(c[r.status]||0)+1); return c; }

function viewDivision() {
  const list = visible();
  const open = list.filter(r => OPEN.includes(r.status));
  const yr = new Date().getFullYear() + '';
  const months = [...Array(6)].map((_,i) => { const d=new Date(); d.setMonth(d.getMonth()-5+i); const m=d.toISOString().slice(0,7); return {l:d.toLocaleString('en',{month:'short'}), a:list.filter(r=>r.created.startsWith(m)).length, b:list.filter(r=>r.filledDate?.startsWith(m)).length}; });
  return `<div class="flex justify-between mb-4"><h2 class="text-lg font-bold">Division ${me.div}</h2><button class="btn btn-o" onclick="exportCSV(${JSON.stringify(list.map(r=>r.id))})">⬇ Download Report</button></div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4">${kpi(open.length,'Current Openings')}${kpi(list.filter(r=>r.status==='Filled'&&r.filledDate?.startsWith(yr)).length,'Filled This Year')}${kpi(list.filter(r=>r.status==='On Hold').length,'On Hold')}${kpi(list.filter(r=>r.status==='Withdrawn').length,'Withdrawn')}${kpi((open.length?Math.round(open.reduce((a,r)=>a+days(r),0)/open.length):0)+'d','Avg. Age (Open)')}</div>
  <div class="grid md:grid-cols-2 gap-4 my-5"><div class="bg-white border rounded-xl p-4"><p class="font-medium text-sm mb-2">Status Breakdown</p>${donut(statusCounts(list))}</div><div class="bg-white border rounded-xl p-4"><p class="font-medium text-sm mb-2">Monthly: Submissions vs Fills</p>${bars(months)}</div></div>
  <p class="font-medium text-sm mb-2">Current Openings — Aging Tracker</p>${agingTable(open, false, true)}`;
}

/* ---------- Approvals ---------- */
function viewApprovals() {
  const list = visible().filter(r => filter==='All' || r.status==='Pending Sign-Off' || r.tpStatus==='Pending DH Approval');
  const pending = visible().filter(r => r.status==='Pending Sign-Off' || r.tpStatus==='Pending DH Approval').length;
  if (filter === 'All' && !window._apInit) { filter = 'Pending'; window._apInit = 1; return viewApprovals(); }
  return `<div class="flex gap-2 mb-4"><button class="badge text-sm px-3 py-1 ${filter==='Pending'?'bg-blue-700 text-white':'bg-white border'}" onclick="filter='Pending';render()">Pending (${pending})</button><button class="badge text-sm px-3 py-1 ${filter==='All'?'bg-blue-700 text-white':'bg-white border'}" onclick="filter='All';render()">All</button></div>
  <div class="space-y-3">${list.map(r => {
    const b = (a,l,c='btn-o') => `<button class="btn ${c}" onclick="act(${r.id},'${a}')">${l}</button>`;
    let acts = '';
    if (r.status === 'Pending Sign-Off') acts += b('approve','Approve & Sign','btn-p') + b('reject','Reject') + b('sendback','Send Back');
    if (r.tpStatus === 'Pending DH Approval') acts += b('approve3p','Review 3rd-Party','btn-p');
    acts += actionsFor(r);
    return `<div class="bg-white border rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3"><div><div class="flex gap-2 items-center"><a class="font-semibold cursor-pointer hover:underline" onclick="detail(${r.id})">${esc(r.title)}</a>${badge(r.status)}</div><p class="text-xs text-gray-500">${r.hc} position(s) · ${r.type} · by ${esc(r.by)} · ${r.created}</p>${r.tp?`<p class="text-xs text-blue-700 mt-1">🤝 3P: ${esc(r.tpAgency)} — ${esc(r.tpFee)} (${esc(r.tpStatus)})</p>`:''}</div><div class="flex flex-wrap gap-2">${acts}</div></div>`;
  }).join('')||'<p class="text-sm text-gray-500">Nothing awaiting your approval 🎉</p>'}</div>`;
}

/* ---------- Vault ---------- */
function viewVault() {
  let list = DB.reqs.filter(r => (filter==='All'||r.status===filter) && (!q||(r.title+r.div).toLowerCase().includes(q.toLowerCase())));
  const val = {title:r=>r.title, div:r=>r.div, hc:r=>r.hc, type:r=>r.type, status:r=>r.status, days:r=>days(r)};
  list.sort((a,b) => { const x=val[sort.k](a), y=val[sort.k](b); return (x>y?1:x<y?-1:0)*sort.d; });
  const th = (k,l) => `<th class="p-3 text-left" onclick="sort={k:'${k}',d:sort.k==='${k}'?-sort.d:1};render()">${l}${sort.k===k?(sort.d>0?' ▲':' ▼'):''}</th>`;
  return `<div class="flex flex-wrap gap-3 mb-4">
  <input class="inp max-w-xs" placeholder="Search requisitions…" value="${esc(q)}" oninput="q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const i=document.querySelector('#view input');i&&(i.focus(),i.setSelectionRange(i.value.length,i.value.length))},300)">
  <select class="inp max-w-[200px]" onchange="filter=this.value;render()"><option>All</option>${Object.keys(COLORS).map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select>
  <button class="btn btn-o" onclick="exportCSV(${JSON.stringify(list.map(r=>r.id))})">⬇ Export</button></div>
  <div class="bg-white border rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr>${th('title','Position')}${th('div','Division')}${th('hc','HC')}${th('type','Type')}${th('status','Status')}${th('days','Days')}<th class="p-3 text-left">JD</th><th class="p-3 text-left">Manatal</th><th class="p-3 text-left">Posted</th><th class="p-3 text-left">Actions</th></tr></thead>
  <tbody>${list.map(r => {
    const b = (a,l) => `<button class="text-blue-700 hover:underline mr-2 text-xs font-semibold" onclick="${['post','shortlist'].includes(a)?`quick(${r.id},'${a}')`:`act(${r.id},'${a}')`}">${l}</button>`;
    let a = '';
    if (r.status==='With Recruitment') a += b('post','Post');
    if (r.status==='Posted') a += b('shortlist','Shortlist');
    if (['Posted','Shortlisting'].includes(r.status)) a += b('fill','Filled');
    if (OPEN.includes(r.status)) { a += b('sendback','Send Back')+b('hold','Hold')+b('withdraw','Withdraw'); if (!r.tp) a += b('suggest3p','Suggest 3P'); }
    if (r.status==='On Hold') a += b('resume','Resume');
    a += b('manatal','Manatal');
    return `<tr class="border-t"><td class="p-3 font-medium"><a class="cursor-pointer hover:underline" onclick="detail(${r.id})">${esc(r.title)}</a>${r.tp?' <span class="text-xs text-gray-500">(3P)</span>':''}</td><td class="p-3">${r.div}</td><td class="p-3">${r.hc}</td><td class="p-3">${r.type}</td><td class="p-3">${badge(r.status)}</td><td class="p-3">${days(r)}</td><td class="p-3">${r.jd?'✓':'—'}</td><td class="p-3">${r.manatal?`<a class="text-blue-700 underline" target="_blank" href="${esc(r.manatal)}">View</a>`:'—'}</td><td class="p-3">${r.posted?'✓':'—'}</td><td class="p-3 whitespace-nowrap">${a}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

/* ---------- 3rd-Party Headhunters ---------- */
function viewTP() {
  const list = DB.reqs.filter(r => r.tp);
  return `<div class="bg-white border rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">Position</th><th class="p-3 text-left">Division</th><th class="p-3 text-left">Agency</th><th class="p-3 text-left">Fee</th><th class="p-3 text-left">Approval</th><th class="p-3 text-left">Invoice</th><th class="p-3 text-left">Client Charged</th><th class="p-3 text-left">Candidate Charged</th></tr></thead><tbody>
  ${list.map(r => `<tr class="border-t"><td class="p-3"><a class="cursor-pointer hover:underline" onclick="detail(${r.id})">${esc(r.title)}</a></td><td class="p-3">${r.div}</td><td class="p-3">${esc(r.tpAgency)}</td><td class="p-3">${esc(r.tpFee)}</td>
  <td class="p-3"><select class="inp text-xs" onchange="setTP(${r.id},'tpStatus',this.value)">${['Pending DH Approval','DH Approved','HR Signed Off','GM Approved','Finance Processed','Declined'].map(s=>`<option ${s===r.tpStatus?'selected':''}>${s}</option>`).join('')}</select></td>
  <td class="p-3">${r.invoice?`<span class="text-xs">📎 ${esc(r.invoice)}</span>`:`<label class="text-blue-700 text-xs cursor-pointer underline">Upload<input type="file" class="hidden" onchange="setTP(${r.id},'invoice',this.files[0]?.name)"></label>`}</td>
  <td class="p-3"><input type="checkbox" ${r.clientCharged?'checked':''} onchange="setTP(${r.id},'clientCharged',this.checked)"></td>
  <td class="p-3"><input type="checkbox" ${r.candCharged?'checked':''} onchange="setTP(${r.id},'candCharged',this.checked)"></td></tr>`).join('') || '<tr><td colspan="8" class="p-4 text-gray-500">No 3rd-party requisitions yet. Use "Suggest 3P" in the Vault.</td></tr>'}</tbody></table></div>`;
}
async function setTP(id, k, v) { await updateReq(id, {[k]: v}); toast('Updated'); }

/* ---------- Settings ---------- */
function viewSettings() {
  return `<div class="grid md:grid-cols-2 gap-6">
  <div class="bg-white border rounded-xl p-4"><div class="flex justify-between mb-3"><p class="font-semibold">Divisions</p><button class="btn btn-p" onclick="addDiv()">+ Add Division</button></div>
  <table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-2 text-left">Name</th><th class="p-2 text-left">LOB Code</th><th class="p-2 text-left">Department</th><th></th></tr></thead>
  <tbody>${DB.divisions.map((d,i)=>`<tr class="border-t"><td class="p-2">${esc(d.name)}</td><td class="p-2">${esc(d.code)}</td><td class="p-2">${esc(d.dept)}</td><td class="p-2 text-right"><button class="text-red-600 text-xs" onclick="removeDiv(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div>
  <div class="bg-white border rounded-xl p-4"><div class="flex justify-between mb-3"><p class="font-semibold">Departments & Designations</p><button class="btn btn-p" onclick="addDept()">+ Department</button></div>
  ${Object.entries(DB.departments).map(([d,ds])=>`<div class="border-t py-2"><div class="flex justify-between"><b class="text-sm">${esc(d)}</b><span><button class="text-blue-700 text-xs mr-2" onclick="addDesig('${esc(d)}')">+ Designation</button><button class="text-red-600 text-xs" onclick="removeDept('${esc(d)}')">Delete</button></span></div><div class="flex flex-wrap gap-1 mt-1">${ds.map((x,i)=>`<span class="badge bg-gray-100">${esc(x)} <button onclick="removeDesig('${esc(d)}',${i})">×</button></span>`).join('')}</div></div>`).join('')}</div></div>`;
}
function addDiv(){modal(`<h3 class="font-bold mb-3">Add Division</h3><input id="dN" class="inp mb-2" placeholder="Division name"><input id="dC" class="inp mb-2" placeholder="LOB code"><input id="dD" class="inp mb-4" placeholder="Department"><div class="flex justify-end gap-2"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveDiv()">Save</button></div>`)}
async function saveDiv(){const n=$('#dN').value.trim(),c=$('#dC').value.trim(),d=$('#dD').value.trim();if(!n||!c)return toast('Name and code required');DB.divisions.push({name:n,code:c,dept:d||'—'});await saveSettingsCurrent();closeModal();render()}
async function removeDiv(i){DB.divisions.splice(i,1);await saveSettingsCurrent();render()}
async function addDept(){const n=prompt('Department name');if(n){DB.departments[n]=[];await saveSettingsCurrent();render()}}
async function addDesig(d){const n=prompt('Designation');if(n){if(!DB.departments[d])DB.departments[d]=[];DB.departments[d].push(n);await saveSettingsCurrent();render()}}
async function removeDept(d){if(!confirm('Delete this department?'))return;delete DB.departments[d];await saveSettingsCurrent();render()}
async function removeDesig(d,i){DB.departments[d].splice(i,1);await saveSettingsCurrent();render()}

/* ---------- User Management ---------- */
function viewUsers() {
  db.collection('users').get().then(snap => {
    cachedUsers = snap.docs.map(d => ({ email: d.id, ...d.data() }));
    if (page === 'users') render();
  });
  const canManage = isSuperAdmin(me.email);
  return `<div class="flex justify-between items-center mb-4">
    <p class="text-sm text-gray-500">Users with access to this portal. Sign in with Google is required.</p>
    ${canManage ? `<button class="btn btn-p" onclick="addUser()">+ Give Access</button>` : ''}
  </div>
  <div class="bg-white border rounded-xl overflow-auto"><table class="w-full text-sm">
  <thead class="bg-gray-50"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Email</th><th class="p-3 text-left">Role</th><th class="p-3 text-left">Division</th><th class="p-3 text-left">Status</th>${canManage?'<th class="p-3"></th>':''}</tr></thead>
  <tbody>${cachedUsers.length ? cachedUsers.map(u=>`<tr class="border-t"><td class="p-3">${esc(u.name||'')}${isSuperAdmin(u.email)?'<span class="badge bg-blue-100 text-blue-700 ml-1">Super Admin</span>':''}</td><td class="p-3 text-gray-600">${esc(u.email)}</td><td class="p-3">${esc(u.role)}</td><td class="p-3">${esc(u.div)}</td><td class="p-3"><span class="badge bg-emerald-100 text-emerald-800">Active</span></td>${canManage?`<td class="p-3">${!isSuperAdmin(u.email)?`<button class="text-red-600 text-xs hover:underline" onclick="removeUser('${esc(u.email)}')">Revoke Access</button>`:''}`:''}</tr>`).join('') : '<tr><td colspan="6" class="p-4 text-gray-400 text-center">Loading users…</td></tr>'}</tbody></table></div>`;
}

function addUser() {
  modal(`<h3 class="font-bold mb-3">Add User</h3>
  <label class="text-sm font-medium">Full Name *</label><input id="uN" class="inp mb-2" placeholder="e.g. J. Perera">
  <label class="text-sm font-medium">Email (Google account) *</label><input id="uE" class="inp mb-2" type="email" placeholder="user@example.com">
  <label class="text-sm font-medium">Role *</label>
  <select id="uR" class="inp mb-2"><option>Division ER</option><option>Division Head</option><option>HR / Recruiter</option></select>
  <label class="text-sm font-medium">Division</label>
  <select id="uD" class="inp mb-4"><option value="All">All (HR)</option>${DB.divisions.map(d=>`<option value="${d.code}">${d.code} — ${esc(d.name)}</option>`).join('')}</select>
  <div class="flex justify-end gap-2"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveUser()">Add User</button></div>`);
}

async function saveUser() {
  const n=$('#uN').value.trim(), e=$('#uE').value.trim().toLowerCase(), r=$('#uR').value, d=$('#uD').value;
  if (!n||!e) return toast('Name and email required');
  await db.collection('users').doc(e).set({name:n, email:e, role:r, div:d});
  closeModal(); toast('User added'); cachedUsers=[];render();
}

async function removeUser(email) {
  if (!confirm(`Remove ${email} from the portal?`)) return;
  await db.collection('users').doc(email).delete();
  toast('User removed'); cachedUsers=[];render();
}

/* ---------- Export ---------- */
function exportCSV(ids) {
  const rows = DB.reqs.filter(r => ids.includes(r.id));
  const cols = ['id','title','div','dept','hc','type','status','created','salary','reason','budget','candidate','filledDate','tpAgency','tpFee','tpStatus'];
  const csv = [cols.join(','), ...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'requisitions-report.csv';
  a.click();
}
</script>
